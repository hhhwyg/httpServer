name: release-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan release commit history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo \
            --config /repo/.gitleaks.toml --redact --exit-code 1 \
            --log-opts="$GITHUB_SHA"
      - name: Build immutable image
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="${IMAGE_REPOSITORY,,}"
          docker build -f Dockerfile.deploy -t "${image}:${IMAGE_TAG}" .
          echo "ref=${image}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Scan candidate image before publication
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            image="${IMAGE_REF%:*}"
            docker tag "$IMAGE_REF" "${image}:${GITHUB_REF_NAME}"
            docker push "${image}:${GITHUB_REF_NAME}"
          fi
