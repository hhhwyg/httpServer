name: deploy-production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable commit SHA image tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Deploy with migration, readiness gate, and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$IMAGE_TAG" <<'REMOTE'
          set -euo pipefail
          image_tag=$1
          cd /opt/httpserver
          # Refuse a modified server checkout before selecting release migrations.
          git diff --quiet
          git diff --cached --quiet
          git fetch --no-tags origin "$image_tag"
          git checkout --detach "$image_tag"
          IMAGE_TAG="$image_tag" scripts/deploy_release.sh
          REMOTE
