name: httpserver-observability

services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile.deploy
      target: build
    command: ["/source/build/release/WebServer", "-b", "epoll", "-t", "2", "-p", "8088", "-l", "/tmp/httpserver.log"]
    ports: ["18083:8088"]

  prometheus:
    image: prom/prometheus:v3.5.5
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    ports: ["19090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on: [webserver]

  grafana:
    image: grafana/grafana:13.1.0
    ports: ["13000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
