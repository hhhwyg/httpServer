  <style>
    :root {
      --page: #10161f;
      --panel: #18212d;
      --soft: #141c27;
      --subtle: #202b39;
      --border: #2c3948;
      --ink: #f2f5f8;
      --muted: #94a3b6;
      --blue: #e98568;
      --blue-dark: #f09a80;
      --blue-soft: #3c2a2b;
      --coral: #e98568;
      --red: #ff7171;
      --green: #6cc494;
      --yellow: #e8bb68;
      --shadow: 0 28px 80px rgba(0, 0, 0, .34);
    }

    * { scrollbar-width: thin; scrollbar-color: #3b4a5b transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: #3b4a5b; background-clip: padding-box; }
    body {
      min-height: 100dvh;
      background:
        linear-gradient(135deg, rgba(233, 133, 104, .07), transparent 30%),
        #10161f;
      font-family: "Segoe UI Variable", "Microsoft YaHei UI", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0;
    }

    button, input, textarea { font-family: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(233, 133, 104, .35);
      outline-offset: 2px;
    }

    .auth-shell {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      padding: 28px;
      background:
        radial-gradient(circle at 82% 14%, rgba(233, 133, 104, .16), transparent 22rem),
        linear-gradient(135deg, #10161f 0%, #131c27 58%, #10161f 100%);
    }
    .auth-shell::before, .auth-shell::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }
    .auth-shell::before { inset: 24px; border: 1px solid rgba(255, 255, 255, .05); border-radius: 16px; }
    .auth-shell::after { width: 34rem; height: 34rem; right: -18rem; bottom: -22rem; border: 1px solid rgba(233, 133, 104, .2); border-radius: 50%; box-shadow: 0 0 0 56px rgba(233, 133, 104, .035), 0 0 0 112px rgba(233, 133, 104, .02); }
    .auth-panel {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 14px;
      background: rgba(24, 33, 45, .94);
      box-shadow: var(--shadow), inset 0 1px rgba(255, 255, 255, .045);
    }
    .brand { gap: 13px; }
    .brand-mark {
      position: relative;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 12px;
      background: var(--coral);
      box-shadow: 0 10px 24px rgba(233, 133, 104, .2);
    }
    .brand-mark::after { position: absolute; inset: 7px; border: 1px solid rgba(255, 255, 255, .44); border-radius: 7px; content: ""; }
    .brand-name { color: var(--ink); font-size: 20px; font-weight: 750; letter-spacing: .01em; }
    .brand-caption { color: var(--muted); font-size: 13px; }
    .auth-tabs { margin: 34px 0 25px; padding: 4px; border: 1px solid var(--border); border-radius: 10px; background: #111923; }
    .auth-tab { min-height: 40px; border-radius: 7px; color: var(--muted); transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
    .auth-tab:hover { color: var(--ink); }
    .auth-tab.active { color: var(--ink); background: #273342; box-shadow: none; }
    .form-title { font-size: 25px; letter-spacing: .01em; }
    .form-caption { color: var(--muted); }
    .field { gap: 8px; margin-top: 18px; }
    .field label, .room-form label { color: #cbd4df; font-weight: 650; }
    .field input, .room-form input, .search-input, .message-input {
      border-color: var(--border);
      color: var(--ink);
      background: #111923;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .field input:hover, .room-form input:hover, .search-input:hover, .message-input:hover { border-color: #45566a; }
    .field input:focus, .room-form input:focus, .search-input:focus, .message-input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(233, 133, 104, .14); }
    .field-hint { color: var(--muted); }
    .primary-button, .secondary-button { min-height: 44px; border-radius: 8px; transition: transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease; }
    .primary-button { border-color: var(--coral); color: #161a20; background: var(--coral); }
    .primary-button:hover { background: var(--blue-dark); }
    .primary-button:active, .secondary-button:active, .icon-button:active, .send-button:active { transform: translateY(1px) scale(.98); }
    .secondary-button { border-color: #425266; color: var(--ink); background: transparent; }
    .secondary-button:hover { border-color: #64778e; background: #24303f; }
    .form-message { font-size: 13px; }

    .app-shell { min-height: 100dvh; padding: 24px; background: #10161f; }
    .chat-app {
      width: min(1280px, 100%);
      height: min(860px, calc(100dvh - 48px));
      min-height: 600px;
      grid-template-columns: 318px minmax(0, 1fr);
      border-color: #293647;
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow), inset 0 1px rgba(255, 255, 255, .035);
    }
    .sidebar { border-color: #293647; background: #141c27; }
    .sidebar-brand { padding: 22px 20px 14px; }
    .sidebar-brand .brand-mark { width: 34px; height: 34px; border-radius: 9px; font-size: 16px; }
    .sidebar-brand .brand-mark::after { inset: 5px; border-radius: 5px; }
    .sidebar-top { padding: 14px 18px 16px; }
    .sidebar-title { color: var(--ink); font-size: 15px; letter-spacing: .01em; }
    .room-count { color: #f2aa95; background: #3c2a2b; }
    .search-icon { color: #8b9aab; }
    .search-input { min-height: 42px; border-radius: 8px; }
    .icon-button {
      border-color: #354456;
      border-radius: 8px;
      color: #ced7e1;
      background: #1d2835;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .icon-button:hover { border-color: #5a6c80; color: #fff; background: #263443; }
    .room-list { padding: 5px 12px 16px; }
    .room-item { position: relative; gap: 12px; margin: 2px 0; padding: 11px 10px; border-radius: 9px; color: #dce4ed; transition: background .16s ease, color .16s ease; }
    .room-item:hover { background: #1d2835; }
    .room-item.active { color: #fff; background: #263443; }
    .room-item.active::before { position: absolute; width: 3px; height: 22px; left: 0; border-radius: 0 3px 3px 0; background: var(--coral); content: ""; }
    .room-icon { border-radius: 9px; color: #b7c4d1; background: #263443; }
    .room-item.active .room-icon { color: #1a2028; background: var(--coral); }
    .room-meta { color: #8798ab; }
    .room-item.active .room-meta { color: #b1bfce; }
    .room-unread { min-width: 20px; height: 20px; display: grid; place-items: center; margin-left: auto; padding: 0 6px; border-radius: 10px; color: #171b22; background: var(--coral); font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .empty-state strong { color: var(--ink); }
    .sidebar-footer { border-color: #293647; background: #111923; }
    .avatar { color: #17202a; background: #aab8c7; }
    .user-name { color: #e7edf4; }
    .user-state, .logout-button { color: #8394a7; }
    .logout-button:hover { color: #ff9b91; }

    .main-chat { background: #18212d; }
    .chat-header { min-height: 80px; padding: 16px 26px; border-color: #293647; background: #18212d; }
    .current-room-icon { border: 1px solid rgba(233, 133, 104, .22); border-radius: 9px; color: #f1a48d; background: #31292d; }
    .room-heading h1 { color: var(--ink); font-size: 19px; letter-spacing: .01em; }
    .room-heading p { color: #8999aa; }
    .connection-state { color: #96a5b5; }
    .status-dot { box-shadow: 0 0 0 3px rgba(169, 183, 197, .12); }
    .status-dot.online { background: var(--green); box-shadow: 0 0 0 3px rgba(108, 196, 148, .12); }
    .status-dot.connecting { background: var(--yellow); box-shadow: 0 0 0 3px rgba(232, 187, 104, .12); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 0 3px rgba(255, 113, 113, .12); }
    .retry-button { color: #f2a28a; }
    .message-list { padding: 30px clamp(20px, 4.4vw, 58px); }
    .room-welcome { gap: 9px; color: #95a4b4; }
    .room-welcome-mark { width: 52px; height: 52px; border: 1px solid rgba(233, 133, 104, .2); border-radius: 14px; color: #f1a48d; background: #31292d; }
    .room-welcome strong { color: #e8eef5; }
    .message-row { margin-bottom: 22px; }
    .message-avatar { background: #b7c3d0; }
    .message-meta { color: #8495a8; }
    .message-state { color: #a6b4c3; }
    .message-state.failed { color: #ff9b91; }
    .message-retry { margin: 0 0 0 3px; padding: 0; border: 0; color: #ff9b91; background: transparent; font-size: 11px; font-weight: 700; }
    .message-retry:hover { color: #ffd1ca; text-decoration: underline; }
    .message-bubble { border-color: #304052; border-radius: 10px; color: #e8eef5; background: #202c3a; box-shadow: none; }
    .message-row.me .message-bubble { border-color: var(--coral); color: #171b22; background: var(--coral); }
    .message-row.me.sending .message-bubble { opacity: .72; }
    .message-row.me.failed .message-bubble { border-color: #f38d85; color: #ffe7e3; background: #3b292c; }

    function updateConnection(mode){$("status-dot").className=`status-dot ${mode}`;setText($("status-text"),{online:"已连接",connecting:"连接中",offline:"已离线"}[mode]||"未连接");$("retry-button").hidden=mode!=="offline";setText($("user-state"),{online:"在线",connecting:"连接中",offline:"离线"}[mode]||"未连接");updateComposer()}
    function updateComposer(){const online=state.ws&&state.ws.readyState===WebSocket.OPEN,hasRoom=Boolean(state.currentRoomId),length=messageInput.value.length;sendButton.disabled=!online||!hasRoom||length===0||length>MAX_MESSAGE_LENGTH;messageInput.disabled=!hasRoom;messageInput.placeholder=!hasRoom?"选择房间后输入消息":!online?"连接恢复后即可发送消息":"输入消息…";setText(charCount,`${length} / ${MAX_MESSAGE_LENGTH}`);charCount.classList.toggle("warning",length>MAX_MESSAGE_LENGTH*.9&&length<=MAX_MESSAGE_LENGTH);charCount.classList.toggle("invalid",length>MAX_MESSAGE_LENGTH)}
    function connectWebSocket(){if(!state.token||(state.ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(state.ws.readyState)))return;clearTimeout(state.reconnectTimer);updateConnection("connecting");const protocol=location.protocol==="https:"?"wss":"ws",socket=new WebSocket(`${protocol}://${location.host}/ws?token=${encodeURIComponent(state.token)}`);state.ws=socket;socket.addEventListener("open",()=>{if(state.ws!==socket)return;state.reconnectDelay=1000;updateConnection("online");subscribeRoom(state.currentRoomId);resumePending(state.currentRoomId)});socket.addEventListener("message",event=>handleSocket(event.data));socket.addEventListener("error",()=>updateConnection("connecting"));socket.addEventListener("close",event=>{if(state.ws===socket)state.ws=null;for(const pending of state.pending.values()){clearTimeout(pending.timer);updateMessageStatus(pending.roomId,pending.messageId,"sending")}updateConnection("offline");if(state.shouldReconnect&&state.token){clearTimeout(state.reconnectTimer);state.reconnectTimer=setTimeout(connectWebSocket,state.reconnectDelay);state.reconnectDelay=Math.min(state.reconnectDelay*2,30000)}if(event.code===1008||event.code===1003)toast("实时连接被服务器拒绝，请重新登录","error")})}
    function subscribeRoom(roomId){if(roomId&&state.ws&&state.ws.readyState===WebSocket.OPEN){const requestId=identifier();state.ws.send(JSON.stringify({version:1,type:"room.subscribe",requestId,payload:{roomId:text(roomId)}}))}}
    function handleSocket(raw){let data;try{data=JSON.parse(raw)}catch(_){addMessage(state.currentRoomId,raw,"system","系统");return}if(data.version!==1)return;if(data.type==="message.created"&&data.payload?.message){mergeServerMessage(data.payload.message);return}if(data.type==="message.ack"&&data.payload){const clientMessageId=text(data.payload.clientMessageId),pending=state.pending.get(clientMessageId);if(!pending)return;clearTimeout(pending.timer);state.pending.delete(clientMessageId);const message=findMessage(pending.roomId,pending.messageId);if(message){message.id=text(data.payload.messageId);message.status="sent";message.time=new Date(data.payload.createdAt);renderMessages()}return}if(data.type==="error"){const code=data.error?.code||"unknown",pending=[...state.pending.values()].find(item=>item.requestId===data.requestId);if(pending){clearTimeout(pending.timer);if(code==="dependency_unavailable")scheduleRetry(pending);else{state.pending.delete(pending.clientMessageId);updateMessageStatus(pending.roomId,pending.messageId,"failed")}}if(code!=="dependency_unavailable"){const messages={room_not_found:"房间不存在或已被关闭",room_membership_required:"请先加入当前房间",invalid_content:"消息内容无效"};addMessage(state.currentRoomId,messages[code]||data.error?.message||"服务器拒绝了这条操作","system","系统")}}}
    function scheduleRetry(pending){clearTimeout(pending.timer);if(pending.attempt>=4){state.pending.delete(pending.clientMessageId);updateMessageStatus(pending.roomId,pending.messageId,"failed");toast("消息确认超时，请手动重试","error");return}const delay=Math.min(1000*2**pending.attempt,8000);pending.timer=setTimeout(()=>dispatchMessage(pending.roomId,pending.messageId),delay)}
    function dispatchMessage(roomId,messageId){const message=findMessage(roomId,messageId);if(!message)return;const clientMessageId=message.clientMessageId||message.id;let pending=state.pending.get(clientMessageId);if(!pending){pending={clientMessageId,roomId,messageId,attempt:0,requestId:"",timer:null};state.pending.set(clientMessageId,pending)}const socket=state.ws;if(!socket||socket.readyState!==WebSocket.OPEN){updateMessageStatus(roomId,messageId,"sending");return}pending.attempt+=1;pending.requestId=identifier();updateMessageStatus(roomId,messageId,"sending");try{socket.send(JSON.stringify({version:1,type:"message.send",requestId:pending.requestId,payload:{roomId:text(roomId),clientMessageId,content:message.content}}));pending.timer=setTimeout(()=>scheduleRetry(pending),5000)}catch(_){scheduleRetry(pending)}}
    function resumePending(roomId){for(const pending of state.pending.values())if(pending.roomId===roomId)dispatchMessage(pending.roomId,pending.messageId)}
    function retryMessage(roomId,messageId){dispatchMessage(roomId,messageId)}
    function sendMessage(event){event.preventDefault();const content=messageInput.value.trim();if(!content||content.length>MAX_MESSAGE_LENGTH||!state.currentRoomId||!state.ws||state.ws.readyState!==WebSocket.OPEN)return;const clientMessageId=identifier(),message=addMessage(state.currentRoomId,content,"me",state.username,{id:clientMessageId,clientMessageId,status:"sending"});messageInput.value="";resizeInput();updateComposer();messageInput.focus();if(message)dispatchMessage(state.currentRoomId,message.id)}
    async function createRoom(event){event.preventDefault();const name=roomNameInput.value.trim();if(!name||new TextEncoder().encode(name).length>128){formMessage(roomMessage,"房间名称需为 1-128 字节");return}$("room-submit").disabled=true;formMessage(roomMessage,"");try{const data=await api("/api/v1/rooms",{method:"POST",body:JSON.stringify({name})}),roomId=text(data.data?.room?.id);await fetchRooms();if(roomId)await switchRoom(roomId);roomDialog.close();roomNameInput.value="";toast("房间创建成功","success")}catch(error){formMessage(roomMessage,errorText(error,"房间创建失败"))}finally{$("room-submit").disabled=false}}
    async function joinRoomById(event){event.preventDefault();const roomId=joinRoomIdInput.value.trim();if(!roomId||new TextEncoder().encode(roomId).length>128){formMessage(joinRoomMessage,"请输入有效的房间 ID");return}$("join-room-submit").disabled=true;formMessage(joinRoomMessage,"");try{await api(`/api/v1/rooms/${encodeURIComponent(roomId)}/members`,{method:"POST"});await fetchRooms();await switchRoom(roomId);joinRoomDialog.close();joinRoomIdInput.value="";toast("已加入房间","success")}catch(error){formMessage(joinRoomMessage,errorText(error,"加入房间失败"))}finally{$("join-room-submit").disabled=false}}
    async function leaveCurrentRoom(){const roomId=state.currentRoomId;if(!roomId)return;try{await api(`/api/v1/rooms/${encodeURIComponent(roomId)}/members/me`,{method:"DELETE"});state.messages.delete(roomId);state.currentRoomId="";localStorage.removeItem(keys.room);await fetchRooms();toast("已退出房间","success")}catch(error){toast(error.code==="room_owner_cannot_leave"?"房主暂时不能退出房间":errorText(error,"退出房间失败"),"error")}}
    function resizeInput(){messageInput.style.height="auto";messageInput.style.height=`${Math.min(messageInput.scrollHeight,132)}px`}
    function toggleMobile(open){$("sidebar").classList.toggle("open",open);$("mobile-scrim").hidden=!open}
    function logout(){state.shouldReconnect=false;clearTimeout(state.reconnectTimer);if(state.ws)state.ws.close(1000,"logout");state.ws=null;for(const pending of state.pending.values())clearTimeout(pending.timer);clearSession();state.rooms=[];state.messages.clear();state.unread.clear();state.pending.clear();updatePageTitle();usernameInput.value="";passwordInput.value="";setAuthMode("login");showAuth("你已退出登录")}
    async function resume(){if(!state.token||!state.username){showAuth();return}authView.hidden=true;appView.hidden=false;setText($("user-name"),state.username);setText($("user-avatar"),initials(state.username));updateConnection("connecting");try{await fetchRooms();connectWebSocket()}catch(error){if(error.status===401){clearSession();showAuth("登录已失效，请重新登录")}else{toast(errorText(error,"会话恢复失败"),"error");updateConnection("offline")}}}
    $("login-tab").addEventListener("click",()=>setAuthMode("login"));$("register-tab").addEventListener("click",()=>setAuthMode("register"));authForm.addEventListener("submit",submitAuth);$("room-search").addEventListener("input",renderRooms);$("create-room-button").addEventListener("click",()=>{formMessage(roomMessage,"");roomNameInput.value="";roomDialog.showModal();roomNameInput.focus()});$("join-room-button").addEventListener("click",()=>{formMessage(joinRoomMessage,"");joinRoomIdInput.value="";joinRoomDialog.showModal();joinRoomIdInput.focus()});$("close-room-dialog").addEventListener("click",()=>roomDialog.close());$("cancel-room-button").addEventListener("click",()=>roomDialog.close());$("close-join-room-dialog").addEventListener("click",()=>joinRoomDialog.close());$("cancel-join-room-button").addEventListener("click",()=>joinRoomDialog.close());roomForm.addEventListener("submit",createRoom);joinRoomForm.addEventListener("submit",joinRoomById);$("leave-room-button").addEventListener("click",leaveCurrentRoom);$("logout-button").addEventListener("click",logout);$("retry-button").addEventListener("click",connectWebSocket);$("mobile-menu").addEventListener("click",()=>toggleMobile(true));$("mobile-scrim").addEventListener("click",()=>toggleMobile(false));$("composer").addEventListener("submit",sendMessage);messageInput.addEventListener("input",()=>{resizeInput();updateComposer()});messageInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();$("composer").requestSubmit()}});window.addEventListener("beforeunload",()=>{state.shouldReconnect=false;clearTimeout(state.reconnectTimer)});setAuthMode("login");updateComposer();resume();
  })();
  </script>
