<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinYa's Chat Room - Multi Room</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --app-bg: rgba(255, 255, 255, 0.85);
            --sidebar-bg: rgba(245, 245, 247, 0.9);
            --msg-me: #007AFF;
            --msg-other: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        /* 登录模态框保持不变... */
        #login-modal { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 320px; text-align: center; }

        /* 主应用布局：侧边栏 + 聊天区 */
        .chat-app {
            width: 95%;
            max-width: 1000px;
            height: 85vh;
            background: var(--app-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .search-container { padding: 20px; }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #fff;
            outline: none;
            font-size: 14px;
        }

        .room-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .room-item {
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .room-item:hover { background: rgba(0,0,0,0.05); }
        .room-item.active { background: var(--primary-color); color: white; }
        .room-icon { width: 40px; height: 40px; background: #ddd; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .active .room-icon { background: rgba(255,255,255,0.2); }

        /* 右侧聊天窗体 */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: transparent; }
        .header { padding: 18px 24px; border-bottom: 1px solid rgba(0, 0, 0, 0.05); display: flex; align-items: center; justify-content: space-between; }
        
        #msg-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .input-area { padding: 20px 24px; background: white; border-top: 1px solid rgba(0,0,0,0.05); display: flex; gap: 12px; }

        input[type="text"]#msg { flex: 1; padding: 12px 20px; border-radius: 24px; border: 1px solid #e5e5ea; background: #f5f5f7; outline: none; }
        button#send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary-color); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        button#send-btn:disabled { background: #e5e5ea; }
        
        /* 气泡样式（复用你之前的） */
        .message { display: flex; align-items: flex-start; max-width: 85%; }
        .message.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .message.me .bubble { background: var(--msg-me); color: white; border-bottom-right-radius: 4px; }
        .message.other .bubble { background: var(--msg-other); color: var(--text-main); border-bottom-left-radius: 4px; }
        .system-msg { align-self: center; font-size: 12px; color: var(--text-muted); background: rgba(0,0,0,0.05); padding: 4px 14px; border-radius: 12px; }
    </style>
</head>
<body>
<div id="login-modal">
    <div class="login-card">
        <h2 id="modal-title">LinYa Chat</h2>
        <div style="margin-top:20px">
            <input type="text" id="username" placeholder="用户名" style="margin-bottom:10px; width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; outline: none;">
            <input type="password" id="password" placeholder="密码" style="margin-bottom:20px; width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; outline: none;">
            
            <div style="display: flex; gap: 10px;">
                <button onclick="login()" style="flex: 1; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">登录</button>
                <button onclick="register()" style="flex: 1; padding: 12px; background: #e5e5ea; color: #333; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">注册</button>
            </div>
        </div>
    </div>
</div>

<div class="chat-app">
    <aside class="sidebar">
        <div class="search-container">
            <input type="text" class="search-box" id="room-search" placeholder="搜索房间..." oninput="filterRooms()">
        </div>
        <div class="room-list" id="room-list">
            <div class="room-item active" onclick="switchRoom(1, '大厅')">
                <div class="room-icon">H</div>
                <div class="room-info">
                    <div style="font-weight:600">综合大厅</div>
                    <div style="font-size:12px; opacity:0.7">公共聊天区域</div>
                </div>
            </div>
            <div class="room-item" onclick="switchRoom(101, '技术交流')">
                <div class="room-icon">T</div>
                <div class="room-info">
                    <div style="font-weight:600">技术交流</div>
                    <div style="font-size:12px; opacity:0.7">聊聊 C++ 和 Linux</div>
                </div>
            </div>
            <div class="room-item" onclick="switchRoom(202, '摸鱼闲谈')">
                <div class="room-icon">F</div>
                <div class="room-info">
                    <div style="font-weight:600">摸鱼闲谈</div>
                    <div style="font-size:12px; opacity:0.7">禁止聊工作</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-chat">
        <div class="header">
            <h1 id="current-room-name">综合大厅</h1>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="status-text" style="font-size:12px; color:var(--text-muted)">未连接</span>
                <div id="status-dot" style="width:8px; height:8px; background:#ff3b30; border-radius:50%"></div>
            </div>
        </div>

        <div id="msg-box">
            <div class="system-msg">欢迎回来！请选择一个房间开始聊天。</div>
        </div>

        <div class="input-area">
            <input type="text" id="msg" placeholder="在此输入消息..." onkeypress="if(event.keyCode==13) send()">
            <button id="send-btn" onclick="send()" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </main>
</div>

<script>
    let ws;
    let myName = "";
    let currentRoomId = 1; // 默认进入 1 号房间

  // 注册逻辑
async function register() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    
    if(!u || !p) return alert("请输入完整的账号和密码");

    try {
        const response = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        });
        
        const data = await response.json();
        
        if (data.ok) {
            alert("注册成功！现在可以登录了。");
        } else {
            alert("注册失败：" + (data.msg || "未知错误"));
        }
    } catch (error) {
        console.error("注册请求失败:", error);
        alert("网络错误，请稍后再试");
    }
}

// 登录逻辑
async function login() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    
    if(!u || !p) return alert("请输入账号密码");

    try {
        // 向后端 /login 路径发起 POST 请求
        const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        });

        const data = await response.json();

        if (data.ok) {
            // 登录成功：保存后端返回的真实 Token 和用户名
            myName = u;
            localStorage.setItem("username", u);
            localStorage.setItem("token", data.token); // 这里必须使用后端返回的 token
            
            // 隐藏登录框并启动 WebSocket
            document.getElementById("login-modal").style.display = "none";
            fetchRooms();
            initWebSocket();
        } else {
            // 登录失败：显示后端传回的错误信息（如：密码错误、用户不存在）
            alert("登录失败：" + (data.msg || "账号或密码错误"));
        }
    } catch (error) {
        console.error("登录请求失败:", error);
        alert("无法连接到服务器，请检查后端服务是否开启");
    }
}

    // WebSocket 初始化
    function initWebSocket() {
        const token = localStorage.getItem("token");
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        // 注意：连接 URL 携带 token 供后端 handleWebSocketHandshake 鉴权
        ws = new WebSocket(`${protocol}${window.location.host}/ws?token=${token}`);

        ws.onopen = () => {
            updateStatus(true);
            // 默认加入初始房间
            joinRoom(currentRoomId);
        };

        ws.onmessage = (evt) => {
            try {
                const data = JSON.parse(evt.data);
                // 只有当消息属于当前房间时才显示（除非后端已经做了分发过滤）
                if (data.roomId === currentRoomId || data.type === "system") {
                    addMsg(data.user || "系统", data.msg, data.user === myName ? "me" : "other");
                }
            } catch(e) {
                addMsg("系统", evt.data, "system");
            }
        };

        ws.onclose = () => updateStatus(false);
    }

    // 创建新房间
async function createNewRoom() {
    const roomName = prompt("请输入房间名称:");
    if (!roomName) return;

    const response = await fetch("/room/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: roomName })
    });

    const data = await response.json();
    if (data.ok) {
        alert("房间创建成功！");
        fetchRooms(); // 重新加载列表以显示新房间
    }
}

// 从后端获取真实房间列表并渲染
async function fetchRooms() {
    try {
        const response = await fetch("/room/list");
        const data = await response.json();
        if (data.ok) {
            renderRoomList(data.rooms);
        }
    } catch (e) {
        console.error("无法加载房间列表");
    }
}

function renderRoomList(rooms) {
    const listEl = document.getElementById('room-list');
    listEl.innerHTML = ""; // 清空
    rooms.forEach(room => {
        const item = document.createElement('div');
        item.className = `room-item ${room.id === currentRoomId ? 'active' : ''}`;
        item.onclick = () => switchRoom(room.id, room.name);
        item.innerHTML = `
            <div class="room-icon">${room.name[0].toUpperCase()}</div>
            <div class="room-info">
                <div style="font-weight:600">${room.name}</div>
                <div style="font-size:12px; opacity:0.7">ID: ${room.id}</div>
            </div>
        `;
        listEl.appendChild(item);
    });
}

    // 3. 房间切换逻辑
    function switchRoom(roomId, roomName) {
        if (roomId === currentRoomId) return;

        // UI 切换
        document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('current-room-name').innerText = roomName;
        document.getElementById('msg-box').innerHTML = `<div class="system-msg">已进入 ${roomName}</div>`;
        
        // 逻辑切换
        currentRoomId = roomId;
        joinRoom(roomId);
    }

    function joinRoom(roomId) {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({
                type: "join",
                roomId: roomId
            }));
        }
    }

    // 4. 搜索过滤
    function filterRooms() {
        const val = document.getElementById('room-search').value.toLowerCase();
        const items = document.querySelectorAll('.room-item');
        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            item.style.display = text.includes(val) ? "flex" : "none";
        });
    }

    // 5. 消息发送（核心：带上 roomId）
    function send() {
        const input = document.getElementById('msg');
        if (input.value && ws && ws.readyState === 1) {
            const payload = {
                type: "chat",
                roomId: currentRoomId,
                user: myName,
                msg: input.value
            };
            ws.send(JSON.stringify(payload));
            addMsg(myName, input.value, "me");
            input.value = "";
        }
    }

    // 工具函数：更新状态和添加气泡
    function updateStatus(online) {
        document.getElementById('status-dot').style.background = online ? "#34c759" : "#ff3b30";
        document.getElementById('status-text').innerText = online ? "已连接" : "离线";
        document.getElementById('send-btn').disabled = !online;
    }

    function addMsg(sender, text, type) {
        const box = document.getElementById('msg-box');
        if (type === "system") {
            box.innerHTML += `<div class="system-msg">${text}</div>`;
        } else {
            const isMe = type === "me";
            const html = `
                <div class="message ${type}" style="margin-bottom:10px; align-self: ${isMe?'flex-end':'flex-start'}">
                    <div style="font-size:11px; color:#888; margin-${isMe?'right':'left'}:10px; text-align:${isMe?'right':'left'}">${sender}</div>
                    <div class="bubble">${text}</div>
                </div>`;
            box.insertAdjacentHTML('beforeend', html);
        }
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
