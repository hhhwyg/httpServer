<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f9f8">
  <title>澄语协作 | 实时沟通平台</title>
  <link rel="icon" href="/assets/icons/messages-square.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/chat.css">
</head>
<body>
  <section class="auth-shell" id="auth-view" aria-labelledby="auth-title">
    <div class="auth-panel">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span class="icon icon-brand"></span></div>
        <span class="brand-name">澄语协作</span>
      </div>
      <div class="auth-heading"><h1 id="auth-title">欢迎回来</h1><p id="auth-caption">登录你的账户</p></div>
      <div class="auth-tabs" role="tablist" aria-label="账户操作">
        <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true">登录</button>
        <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false">注册</button>
      </div>
      <form id="auth-form" novalidate>
        <div class="field"><label for="username">用户名</label><input id="username" name="username" type="text" autocomplete="username" maxlength="64" placeholder="输入用户名" required></div>
        <div class="field"><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="输入密码" required><button class="icon-button password-toggle" id="password-toggle" type="button" title="显示密码" aria-label="显示密码" aria-pressed="false"><span class="icon icon-eye" aria-hidden="true"></span></button></div></div>
        <div class="form-message" id="auth-message" role="status" aria-live="polite"></div>
        <button class="primary-button auth-submit" id="auth-submit" type="submit">登录</button>
      </form>
    </div>
  </section>

  <section class="app-shell" id="app-view" hidden>
    <div class="chat-app">
      <aside class="sidebar" id="sidebar" aria-label="房间列表">
        <div class="sidebar-brand"><div class="brand-mark" aria-hidden="true"><span class="icon icon-brand"></span></div><span class="brand-name">澄语协作</span><button class="icon-button mobile-sidebar-close" id="close-sidebar-button" type="button" title="关闭房间列表" aria-label="关闭房间列表"><span class="icon icon-x" aria-hidden="true"></span></button></div>
        <div class="sidebar-top">
          <div class="sidebar-heading"><div class="sidebar-title-group"><h2 class="sidebar-title">我的房间</h2><span class="room-count" id="room-count">0</span></div><div class="sidebar-actions"><button class="icon-button" id="join-room-button" type="button" title="通过 ID 加入房间" aria-label="通过 ID 加入房间"><span class="icon icon-hash" aria-hidden="true"></span></button><button class="icon-button create-room-button" id="create-room-button" type="button" title="创建房间" aria-label="创建房间"><span class="icon icon-plus" aria-hidden="true"></span></button></div></div>
          <label class="search-wrap"><span class="icon icon-search" aria-hidden="true"></span><span class="sr-only">搜索房间</span><input class="search-input" id="room-search" type="search" placeholder="搜索房间" autocomplete="off"></label>
          <div class="room-filters" role="tablist" aria-label="筛选房间"><button class="room-filter active" id="all-rooms-filter" type="button" role="tab" aria-selected="true">全部</button><button class="room-filter" id="unread-rooms-filter" type="button" role="tab" aria-selected="false" tabindex="-1">未读<span id="unread-room-count" hidden>0</span></button></div>
        </div>
        <div class="room-list" id="room-list" aria-live="polite"></div>
        <div class="sidebar-footer"><div class="avatar user-avatar" id="user-avatar">?</div><div class="user-copy"><div class="user-name" id="user-name">未登录</div><div class="user-state"><span class="user-presence" aria-hidden="true"></span><span id="user-state">未连接</span></div></div><button class="icon-button logout-button" id="logout-button" type="button" title="退出登录" aria-label="退出登录"><span class="icon icon-logout" aria-hidden="true"></span></button></div>
      </aside>
      <div class="mobile-scrim" id="mobile-scrim" hidden></div>
      <main class="main-chat">
        <header class="chat-header">
          <button class="icon-button mobile-menu" id="mobile-menu" type="button" title="打开房间列表" aria-label="打开房间列表" aria-controls="sidebar" aria-expanded="false"><span class="icon icon-panel" aria-hidden="true"></span></button>
          <div class="room-heading"><span class="current-room-icon" id="current-room-icon">?</span><div class="room-heading-copy"><h1 id="current-room-name">选择一个房间</h1><p id="current-room-meta"></p></div></div>
          <div class="chat-actions"><div class="connection-state" aria-live="polite"><span class="status-dot offline" id="status-dot"></span><span id="status-text">未连接</span><button class="icon-button retry-button" id="retry-button" type="button" title="重新连接" aria-label="重新连接" hidden><span class="icon icon-retry" aria-hidden="true"></span></button></div><span class="toolbar-divider" aria-hidden="true"></span><button class="icon-button" id="copy-room-button" type="button" title="复制房间 ID" aria-label="复制房间 ID"><span class="icon icon-copy" aria-hidden="true"></span></button><button class="icon-button leave-room-button" id="leave-room-button" type="button" title="退出当前房间" aria-label="退出当前房间"><span class="icon icon-logout" aria-hidden="true"></span></button></div>
        </header>
        <section class="message-list" id="message-list" aria-live="polite" aria-label="聊天消息"></section>
        <div class="latest-message-wrap"><button class="latest-message-button" id="latest-message-button" type="button" hidden><span class="icon icon-down" aria-hidden="true"></span>回到最新消息</button></div>
        <form class="composer" id="composer">
          <div class="composer-row"><label class="sr-only" for="message-input">消息内容</label><textarea class="message-input" id="message-input" rows="1" maxlength="4096" placeholder="选择房间后输入消息"></textarea><button class="send-button" id="send-button" type="submit" title="发送消息" aria-label="发送消息"><span class="icon icon-send" aria-hidden="true"></span></button></div>
          <div class="composer-foot"><span class="composer-context"><span class="icon icon-hash" aria-hidden="true"></span><span class="composer-room" id="composer-room"></span></span><span class="char-count" id="char-count">0 / 4096 B</span></div>
        </form>
      </main>
    </div>
  </section>

  <dialog id="room-dialog" aria-labelledby="room-dialog-title"><div class="dialog-body"><div class="dialog-header"><div class="dialog-symbol"><span class="icon icon-plus" aria-hidden="true"></span></div><button class="icon-button dialog-close" id="close-room-dialog" type="button" title="关闭" aria-label="关闭"><span class="icon icon-x" aria-hidden="true"></span></button></div><h2 id="room-dialog-title">创建房间</h2><form class="room-form" id="room-form" novalidate><label for="room-name-input">房间名称</label><input id="room-name-input" type="text" maxlength="128" placeholder="例如：产品讨论" required><div class="form-message" id="room-message" role="status" aria-live="polite"></div><div class="room-form-actions"><button class="secondary-button" id="cancel-room-button" type="button">取消</button><button class="primary-button" id="room-submit" type="submit">创建房间</button></div></form></div></dialog>
  <dialog id="join-room-dialog" aria-labelledby="join-room-dialog-title"><div class="dialog-body"><div class="dialog-header"><div class="dialog-symbol"><span class="icon icon-hash" aria-hidden="true"></span></div><button class="icon-button dialog-close" id="close-join-room-dialog" type="button" title="关闭" aria-label="关闭"><span class="icon icon-x" aria-hidden="true"></span></button></div><h2 id="join-room-dialog-title">加入房间</h2><form class="room-form" id="join-room-form" novalidate><label for="join-room-id-input">房间 ID</label><input id="join-room-id-input" type="text" maxlength="128" placeholder="输入房间 ID" required><div class="form-message" id="join-room-message" role="status" aria-live="polite"></div><div class="room-form-actions"><button class="secondary-button" id="cancel-join-room-button" type="button">取消</button><button class="primary-button" id="join-room-submit" type="submit">加入房间</button></div></form></div></dialog>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="/chat.js" defer></script>
</body>
</html>
